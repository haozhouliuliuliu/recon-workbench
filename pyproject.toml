[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "recon-workbench"
version = "0.1.0"
description = "企业对账与单据审核工作台（全部数据为虚构，仅用于公开练手展示）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "haozhouliuliuliu" }]
keywords = ["reconciliation", "excel", "fastapi", "pydantic", "demo"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "openpyxl>=3.1,<4",
  "pydantic>=2.6,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
]
server = [
  "fastapi>=0.111,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9,<1",
  "httpx>=0.27,<1",
]
llm = [
  "httpx>=0.27,<1",
]

[project.scripts]
recon = "recon_workbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error::DeprecationWarning:recon_workbench.*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# 中文全角标点属于内容而非代码风格问题
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["recon_workbench"]

[tool.coverage.run]
source = ["recon_workbench"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
